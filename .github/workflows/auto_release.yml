name: Build & Auto-Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Auto-Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Extract Commit Info & Version
        id: vars
        run: |
          RUN_NUM="${{ github.run_number }}"
          VER_CODE="$RUN_NUM"
          VER_NAME="1.0.$RUN_NUM"
          echo "ver_code=$VER_CODE" >> $GITHUB_OUTPUT
          echo "ver_name=$VER_NAME" >> $GITHUB_OUTPUT

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease \
            -PappVersionCode=${{ steps.vars.outputs.ver_code }} \
            -PappVersionName=${{ steps.vars.outputs.ver_name }}

      - name: Prepare APK Asset
        run: |
          cp app/build/outputs/apk/release/app-release.apk AshuChat.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.vars.outputs.ver_name }}
          name: "AshuChat v${{ steps.vars.outputs.ver_name }}"
          body: |
            ### 🚀 What's New
            ${{ github.event.head_commit.message }}

            ---
            *Automated CI/CD build for commit `${{ github.sha }}`.*
          files: |
            AshuChat.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync Update to Firebase Realtime Database
        run: |
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/v${{ steps.vars.outputs.ver_name }}/AshuChat.apk"
          COMMIT_MSG=$(echo "${{ github.event.head_commit.message }}" | tr '\n' ' ' | sed 's/"/\\"/g')
          PAYLOAD=$(cat <<EOF
          {
            "versionCode": ${{ steps.vars.outputs.ver_code }},
            "versionName": "v${{ steps.vars.outputs.ver_name }}",
            "releaseNotes": "$COMMIT_MSG",
            "downloadUrl": "$DOWNLOAD_URL",
            "timestamp": $(date +%s%3N)
          }
          EOF
          )
          curl -s -X PUT -H "Content-Type: application/json" -d "$PAYLOAD" "https://ashuchat-51b3e-default-rtdb.asia-southeast1.firebasedatabase.app/app_update.json" || true
